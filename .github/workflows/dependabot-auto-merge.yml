# Squash-merge Dependabot minor/patch PRs once every reported check is green.
# Majors stay manual on purpose: Django/Next majors can break the DoD in ways
# CI cannot judge (dropped Python support, changed build output), so a human
# reads them first.
#
# Why pull_request_target: Dependabot-triggered `pull_request` runs get a
# read-only token, so the merge call would 403. pull_request_target runs with
# the base branch's write token, and this workflow never checks out PR code —
# it only reads metadata and merges.
name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  # The check-run rollup below is a REST read; without read access gh fails
  # with "Resource not accessible by integration".
  checks: read
  statuses: read
  actions: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for checks, then squash-merge minor/patch
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Poll check-runs instead of `gh pr checks --watch`: the watch query
        # also sees this very job ("auto-merge", pending) and would deadlock
        # waiting for itself. The other checks are path-filtered, so a
        # requirements.txt bump only waits for Backend Check + Dependency
        # Audit and a bun.lock bump for Web Check + Dependency Audit — GitHub
        # reports exactly the checks that ran for the touched paths.
        run: |
          HEAD_SHA=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
          state="pending"
          for i in $(seq 1 90); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" --jq '
              [.check_runs[] | select(.name != "auto-merge")] as $c
              | if ($c | length) == 0 then "pending"
                elif ([$c[] | select(.status != "completed")] | length) > 0 then "pending"
                elif ([$c[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length) > 0 then "fail"
                else "pass" end')
            echo "poll $i: $state"
            [ "$state" = "pending" ] || break
            sleep 10
          done
          if [ "$state" != "pass" ]; then
            echo "checks are ${state}; leaving PR for manual review"
            exit 1
          fi
          gh pr merge "$PR_URL" --squash --delete-branch

      - name: Leave major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "major version bump - human review required, not merging"

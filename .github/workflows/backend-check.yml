# Backend side of the Definition of Done (AGENTS.md section 11).
#
# PostgreSQL from day one, never SQLite (docs/adr/001), so the job runs a
# pgvector service container — the same image as docker-compose.yml — instead
# of swapping engines for CI convenience.
name: Backend Check

on:
  push:
    paths:
      - "accounts/**"
      - "config/**"
      - "materials/**"
      - "tools/**"
      - "chat/**"
      - "spaces/**"
      - "manage.py"
      - "requirements.txt"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "accounts/**"
      - "config/**"
      - "materials/**"
      - "tools/**"
      - "chat/**"
      - "spaces/**"
      - "manage.py"
      - "requirements.txt"
      - ".github/workflows/backend-check.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: faculty_hub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # django-environ never overwrites variables already in the environment,
      # so these win even though CI has no .env file (read_env on a missing
      # file is a no-op). Values mirror .env.example, not real credentials.
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: faculty_hub
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The four commands AGENTS.md section 11 requires, in dependency order.
      - run: python manage.py test
      - run: python manage.py check
      - run: python manage.py makemigrations --check
      - run: python manage.py spectacular --validate

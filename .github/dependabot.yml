# Group routine bumps into one PR per ecosystem so review stays cheap.
# Majors and security updates are never grouped — they go out individually.
#
# No target-branch is set: until a dedicated integration branch exists, PRs
# land on the repository default branch.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      time: "11:00"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: bun
    directory: "/webui"
    schedule:
      interval: weekly
      time: "11:00"
    open-pull-requests-limit: 5
    groups:
      bun-minor-patch:
        update-types: ["minor", "patch"]
